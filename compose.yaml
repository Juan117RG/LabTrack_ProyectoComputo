services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labtrack
      POSTGRES_PASSWORD: labtrack_local
      POSTGRES_DB: labtrack
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labtrack -d labtrack"]
      interval: 5s
      retries: 10
  api:
    build: {context: ., dockerfile: docker/api.Dockerfile}
    environment:
      PORT: 3001
      DATABASE_URL: postgres://labtrack:labtrack_local@db:5432/labtrack
      CORS_ORIGIN: http://localhost:3000
    ports: ["3001:3001"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: docker/web.Dockerfile}
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3001
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
